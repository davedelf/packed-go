# ==============================================
# DATABASE CONFIGURATION
# ==============================================
spring.datasource.url=jdbc:postgresql://postgres-central:5432/users_db
spring.datasource.username=packedgo_admin
spring.datasource.password=packedgo_admin_pass
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# External Services Configuration
app.services.auth-service.base-url=${AUTH_SERVICE_URL}
app.services.event-service.base-url=${EVENT_SERVICE_URL}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}

# Docker Compose Configuration - Disable auto-discovery
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=none

# Logging
logging.level.com.packed_go.users_service=${LOGGING_LEVEL_USERS}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized